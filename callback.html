<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결 마지막 단계 · 판책임 업로더</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
  /* Layout: one quiet reading column, two documents separated by a tabbed switcher (hash-routed) */
  :root {
    --bg: #fbfaf8;
    --fg: #23211f;
    --muted: #6d6863;
    --line: #e6e1dc;
    --accent: #c9577a;      /* 판책임의 분홍 리본 */
    --chip: #f6e6ec;
    --display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a19; --fg: #ece8e4; --muted: #a8a19b; --line: #34312e;
      --accent: #e98aa8; --chip: #3a2730; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a19; --fg: #ece8e4; --muted: #a8a19b; --line: #34312e;
    --accent: #e98aa8; --chip: #3a2730; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 16px; line-height: 1.75;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 8px; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 36px); line-height: 1.3; margin: 0; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav a {
    text-decoration: none; color: var(--fg); padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 14px;
  }
  nav a[aria-current="page"] { background: var(--chip); border-color: transparent; color: var(--accent); font-weight: 600; }
  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  article { display: grid; gap: 18px; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
  h3 { font-size: 16px; font-weight: 600; margin: 0; }
  section { display: grid; gap: 6px; padding-top: 18px; border-top: 1px solid var(--line); }
  p, ul { margin: 0; }
  ul { padding-left: 1.2em; }
  .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .en { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">거절 못하는 판책임 · @panchaegim</span>
    <h1>연결 마지막 단계</h1>
    <p class="lede">아래 주소 전체를 복사해서 맥의 터미널에 붙여넣고 Enter 를 누르세요.</p>
  </header>
  <section>
    <textarea id="addr" readonly rows="5" style="width:100%;box-sizing:border-box;font:14px/1.5 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical"></textarea>
    <p><button id="copy" type="button" style="font:inherit;padding:8px 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer">주소 복사</button> <span id="msg" class="meta"></span></p>
  </section>
  <p class="meta">이 페이지는 아무 정보도 저장하거나 보내지 않습니다.</p>
</div>
<script>
  var a = document.getElementById("addr"); a.value = location.href;
  document.getElementById("copy").addEventListener("click", function () {
    var m = document.getElementById("msg");
    if (navigator.clipboard) navigator.clipboard.writeText(a.value).then(function(){ m.textContent = "복사됨"; }, function(){ a.select(); m.textContent = "선택됨 → ⌘C"; });
    else { a.select(); m.textContent = "선택됨 → ⌘C"; }
  });
</script>
</body>
</html>
